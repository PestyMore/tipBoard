[package]
name = "tipboard"
version = "1.0.1"
edition = "2021"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = 'abort'
strip = true

[dependencies]
eframe = "0.29.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4"] }
egui_extras = { version = "0.29.1", features = ["image"] }
image = "0.24"

[build-dependencies]
embed-resource = "2.4"
